events {}

http {
  server {
    listen 80;
    server_name _;

    # Grafana: unico servicio expuesto a internet (detras de Cloudflare proxy).
    location / {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # ponytail: JSON-RPC (8545) y Engine API (8551) NO se exponen via nginx ni al host.
  # Exponer RPC publico sin allowlist/rate-limit es el vector mas comun de robo de fondos
  # en nodos mal configurados. Si en algun momento hace falta RPC externo, agregar un
  # server{} nuevo con `allow`/`deny` por IP + `limit_req`, nunca abrirlo tal cual.
}
