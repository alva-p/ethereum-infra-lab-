global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nethermind
    static_configs:
      - targets: ["execution:6060"]

  - job_name: lighthouse
    scrape_timeout: 12s
    static_configs:
      - targets: ["consensus:5054"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

rule_files:
  - /etc/prometheus/alerts.yml
